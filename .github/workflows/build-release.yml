name: Build and prepare portable release

on:
  push:
    branches: [main]
    tags: ['app-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content MyPiggyBank.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "app-v$version") { throw 'Release tag must match the four-part application version.' }
      - name: Test and publish portable package
        shell: pwsh
        run: ./publish.ps1
      - name: Generate package checksum
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem -LiteralPath dist -Filter 'Piggy-Piggy-*-win-x64.zip' -File) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding utf8NoBOM
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-win-x64
          path: |
            dist/Piggy-Piggy-*-win-x64.zip
            dist/Piggy-Piggy-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh run download $env:GITHUB_RUN_ID --name portable-win-x64 --dir release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          $version = ([xml](Get-Content MyPiggyBank.csproj -Raw)).Project.PropertyGroup.Version
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "Piggy - Piggy $version" --notes-file RELEASE_NOTES.md
